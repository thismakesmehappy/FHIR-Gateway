services:
  fhir-gateway:
    build: .
    ports:
      - "8080:8080"

  kong:
    image: kong:3.9
    ports:
      - "8100:8000"
      - "8001:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/etc/kong/kong.yml"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./kong.yml:/etc/kong/kong.yml
    depends_on:
      - fhir-gateway